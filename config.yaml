project:
  data_dir: data
  output_dir: outputs
  cache_dir: cache

sec:
  user_agent: "REPLACE_WITH_YOUR_NAME your.email@example.com"
  max_requests_per_second: 4.0
  cache_hours: 12
  timeout_seconds: 45
  retries: 4

analysis:
  history_years: 7
  hurdle_rate: 0.15
  default_ai_asset_life_years:
    downside: 3.0
    base: 4.0
    upside: 5.0
  default_maintenance_capex_pct:
    downside: 0.05
    base: 0.03
    upside: 0.02
  default_tax_rate: 0.21
  minimum_manual_confidence: 0.25
  snippet_filings_per_company: 2
  capital_owner_layers:
    - hyperscaler
    - hyperscaler_application
    - cloud
  downstream_signal_layers:
    - model_provider
    - application
    - hyperscaler_application

manual_entities:
